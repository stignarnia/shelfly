apply plugin: "com.android.library"
apply plugin: 'dagger.hilt.android.plugin'
apply from: '../versions.gradle'

android {
  compileOptions {
    coreLibraryDesugaringEnabled = true
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
  }

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    minSdk = versions.minSdk
    targetSdk = versions.targetSdk
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
  }

  // local.properties is gitignored and absent on a fresh clone and on CI.
  // Missing keys fall back to empty strings rather than failing the build.
  Properties properties = new Properties()
  def localPropertiesFile = project.rootProject.file('local.properties')
  if (localPropertiesFile.exists()) {
    localPropertiesFile.withDataInputStream { properties.load(it) }
  }

  buildTypes.all {
    buildConfigField("String", "VER_NAME", "\"${versions.versionName}\"")
    buildConfigField("int", "VER_CODE", "${versions.versionCode}")

    // Release ships no key material - users enter their own keys at runtime.
    // Debug builds prefill from local.properties so development does not mean retyping a key after every install.
    buildConfigField("String", "TMDB_API_KEY", '""')
    buildConfigField("String", "OMDB_API_KEY", '""')
  }

  buildTypes {
    debug {
      minifyEnabled = false
      buildConfigField("String", "TMDB_API_KEY", properties.getProperty("tmdbApiKey", '""'))
      buildConfigField("String", "OMDB_API_KEY", properties.getProperty("omdbApiKey", '""'))
    }

    release {
      minifyEnabled = false
    }
  }

  namespace = 'xyz.stignarnia.data_remote'
}

dependencies {
  implementation project(':common')

  api libs.retrofit
  api libs.retrofit.moshi
  api libs.loggingInterceptor

  implementation libs.moshi
  implementation libs.coroutines
  implementation libs.timber

  implementation libs.hilt.android
  ksp libs.hilt.compiler

  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.mockwebserver
  testImplementation libs.coroutinesTest

  coreLibraryDesugaring libs.android.desugar
}
