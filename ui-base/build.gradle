apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'dagger.hilt.android.plugin'
apply from: '../versions.gradle'

android {
  kotlinOptions { jvmTarget = "21" }

  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  buildFeatures {
    viewBinding true
  }

  compileSdkVersion versions.compileSdk

  defaultConfig {
    minSdkVersion versions.minSdk
    targetSdkVersion versions.targetSdk
    compileSdkVersion versions.compileSdk

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  namespace 'xyz.stignarnia.ui_base'
}

// ThemeResourcesTest reads the theme XML off the filesystem rather than through
// R, because what it checks is which entries exist - something R cannot express.
// Gradle has no way to know that, so without this the test task stays up to date
// through any resource edit and the guard silently stops running.
tasks.withType(Test).configureEach {
  inputs
    .dir('src/main/res')
    .withPropertyName('themeResources')
    .withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
  implementation project(':common')
  implementation project(':data-remote')
  implementation project(':data-local')
  implementation project(':ui-model')
  implementation project(':ui-navigation')
  implementation project(':repository')

  testImplementation libs.bundles.testing

  api libs.android.appcompat
  api libs.android.core
  api libs.bundles.android.lifecycle
  api libs.bundles.android.navigation
  api libs.android.fragment
  api libs.android.recycler
  api libs.android.constraintlayout
  api libs.android.work
  api libs.android.material
  api libs.android.dynamicanimation
  api libs.overscrollDecor
  api libs.timber

  api libs.glide

  implementation libs.hilt.android
  ksp libs.hilt.compiler

  implementation libs.hilt.work
  ksp libs.hilt.work.compiler

  coreLibraryDesugaring libs.android.desugar
}
