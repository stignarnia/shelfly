name: Build

# Only release builds.
# Day-to-day verification happens locally; running the full matrix on every push burns minutes for a single-maintainer fork.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Covers the file types ktlint cannot read.
      # Needs no toolchain, so it runs first.
      - name: Check non-Kotlin formatting
        run: ./scripts/check-format.sh

      - name: Run ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod a+x ktlint
          ./ktlint

  test:
    name: Tests and Verification
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because check-schemas.sh compares against the last tag, and a shallow clone has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First, because it needs no toolchain and fails in under a second.
      # The release step in the build job publishes release_notes.txt as the GitHub Release body, so a heading left on the previous version would ship as the public description of this one.
      - name: Check release notes
        run: ./scripts/check-release-notes.sh

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # No API keys needed: the build falls back to empty strings, and keys are supplied by the user at runtime rather than baked into the binary.
      # The two opt-in suites skip themselves here - TmdbLiveApiTest wants a real key, and BackupMigrationV2FileTest wants SHELFLY_V2_BACKUP - so nothing in this job reaches the network.
      #
      # Debug variant only.
      # Unit tests never run R8, so ./gradlew test would just re-execute the same sources for the release variant - twice the tasks for the same signal.
      #
      # This is not the full sweep from CLAUDE.md.
      # It covers the unit tests and Android Lint across every module; it does not compile or run the androidTest sources, which need a device, so MigrationsTest and the DAO tests are verified locally rather than here.
      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --warning-mode all

      # After the Gradle step, because the drift half reads what the Room compiler just regenerated.
      - name: Check Room schemas
        run: ./scripts/check-schemas.sh

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*
          retention-days: 7

  build:
    name: Build APK
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional.
      # Without these secrets the release APK still builds, just unsigned.
      # The guard lives in the shell because the secrets context is not available to a step-level "if", which fails the workflow at parse time.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore
          cat > app/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Github Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body_path: app/src/main/assets/release_notes.txt
          # Appends the commit log beneath the hand-written notes, so a release is never published with an empty description.
          generate_release_notes: true
