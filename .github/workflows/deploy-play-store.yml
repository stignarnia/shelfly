name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        default: 'alpha'
        options:
          - 'alpha'
          - 'internal'
          - 'beta'
          - 'production'
      upload_latest_release_bundle:
        description: 'Upload latest release bundle (AAB)'
        type: boolean
        default: false
      upload_images:
        description: 'Upload screenshots and icon'
        type: boolean
        default: true
      validate_only:
        description: 'Validate only (dry run without applying changes)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Latest Release Bundle (AAB)
        if: ${{ inputs.upload_latest_release_bundle }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-bundle
          gh release download --repo ${{ github.repository }} --pattern "*.aab" --dir /tmp/release-bundle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Run Fastlane Supply
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::PLAY_STORE_JSON_KEY secret is not set in repository secrets."
            exit 1
          fi

          echo "$PLAY_STORE_JSON_KEY" > /tmp/play-store-key.json
          export SUPPLY_JSON_KEY=/tmp/play-store-key.json

          VERSION_CODE="$(sed -n 's/^versionCode[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -n 1)"

          AAB_ARG=""
          if [ "${{ inputs.upload_latest_release_bundle }}" = "true" ]; then
            AAB_PATH="$(ls /tmp/release-bundle/*.aab 2>/dev/null | head -n 1 || true)"
            if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
              AAB_ARG="aab:$AAB_PATH"
            else
              echo "::error::No AAB bundle found in the latest release."
              exit 1
            fi
          fi

          fastlane android deploy \
            track:${{ inputs.track }} \
            version_code:$VERSION_CODE \
            $AAB_ARG \
            upload_images:${{ inputs.upload_images }} \
            validate_only:${{ inputs.validate_only }}

          rm -f /tmp/play-store-key.json
          rm -rf /tmp/release-bundle
