name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      include_release_bundle:
        description: 'Build and upload release bundle (AAB)'
        type: boolean
        default: false
      track:
        description: 'Google Play track'
        type: choice
        default: 'alpha'
        options:
          - 'alpha'
          - 'internal'
          - 'beta'
          - 'production'
      upload_images:
        description: 'Upload screenshots and icon'
        type: boolean
        default: true
      validate_only:
        description: 'Validate only (dry run without applying changes)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: ${{ inputs.include_release_bundle }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        if: ${{ inputs.include_release_bundle }}
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Keystore
        if: ${{ inputs.include_release_bundle }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore
          cat > app/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release Bundle (AAB)
        if: ${{ inputs.include_release_bundle }}
        run: ./gradlew :app:bundleRelease

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Run Fastlane Supply
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::PLAY_STORE_JSON_KEY secret is not set in repository secrets."
            exit 1
          fi

          echo "$PLAY_STORE_JSON_KEY" > /tmp/play-store-key.json
          export SUPPLY_JSON_KEY=/tmp/play-store-key.json

          AAB_ARG=""
          if [ "${{ inputs.include_release_bundle }}" = "true" ]; then
            AAB_PATH="$(ls app/build/outputs/bundle/release/*.aab | head -n 1)"
            if [ ! -f "$AAB_PATH" ]; then
              echo "::error::Release bundle not found."
              exit 1
            fi
            AAB_ARG="aab:$AAB_PATH"
          fi

          fastlane android deploy \
            track:${{ inputs.track }} \
            $AAB_ARG \
            upload_images:${{ inputs.upload_images }} \
            validate_only:${{ inputs.validate_only }}

          rm -f /tmp/play-store-key.json
