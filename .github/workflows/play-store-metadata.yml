name: Play Store - Solo Metadati

on:
  workflow_dispatch:
    inputs:
      upload_images:
        description: 'Carica screenshot e icona'
        type: boolean
        default: true
      validate_only:
        description: 'Sola convalida (dry run senza applicare modifiche)'
        type: boolean
        default: false

jobs:
  deploy-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Deploy Metadata to Google Play
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::PLAY_STORE_JSON_KEY secret is not set in repository secrets."
            exit 1
          fi

          echo "$PLAY_STORE_JSON_KEY" > /tmp/play-store-key.json
          export SUPPLY_JSON_KEY=/tmp/play-store-key.json

          fastlane android deploy_metadata \
            validate_only:${{ inputs.validate_only }} \
            upload_images:${{ inputs.upload_images }}

          rm -f /tmp/play-store-key.json
