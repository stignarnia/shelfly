# # For more details on how to configure your build environment visit http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# More details, visit http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects org.gradle.parallel=true Tue Aug 27 20:07:15 CEST 2019 org.gradle.java.home
kotlin.code.style=official
android.enableJetifier=false
# D8 dexing runs inside the Gradle daemon, so this heap is what a large dex merge exhausts - 2 GiB was not enough to build the androidTest variants of every module at once.
# Setting org.gradle.jvmargs replaces Gradle's own defaults rather than adding to them, which is why the metaspace cap is spelled out here; left unset it is reported as "unknown" and grows unbounded.
# The Kotlin daemon is a separate process with its own heap and has never been the constraint, so it stays where it was.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
android.useAndroidX=true
android.nonTransitiveRClass=false
# Experimental feature to enable the configuration cache.
org.gradle.configuration-cache=true